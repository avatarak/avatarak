# Avatarak.ir — nginx in front of php-fpm. TLS is terminated before this (Caddy, Traefik, a load balancer or Cloudflare).
fastcgi_cache_path /var/cache/nginx/avatars levels=1:2 keys_zone=avatars:20m max_size=512m inactive=1h use_temp_path=off;

map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; }

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # never serve hidden files, except the standard well-known folder (domain verification uses it)
    location ~ /\.(?!well-known) { deny all; }

    # fingerprinted build assets and icons: cache for a year
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:ico|png|svg|webmanifest|txt)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @app;
    }

    # Avatars are the hottest URL. A short shared cache in front of PHP absorbs bursts and lets the
    # app answer from its own cache; the app already sends Cache-Control for browsers and CDNs.
    location ~ ^/(avatar/[A-Fa-f0-9]{64}|[A-Za-z][A-Za-z0-9_]{2,31}/avatar)$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $fwd_proto;
        fastcgi_cache avatars;
        fastcgi_cache_key "$scheme$request_method$host$request_uri$http_accept";
        fastcgi_cache_valid 200 304 60s;
        fastcgi_cache_valid 404 10s;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location @app { rewrite ^ /index.php last; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $fwd_proto;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }       # only index.php is ever executed
}
