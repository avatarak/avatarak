services:
  caddy:
    image: ${IMAGE_REGISTRY:-docker.io/library}/caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:-avatarak.ir}
      DOMAIN_CHECK_KEY: ${DOMAIN_CHECK_KEY:?set DOMAIN_CHECK_KEY in .env}
    depends_on:
      web: { condition: service_healthy }
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
