# Avatarak.ir production stack: nginx + php-fpm + queue worker + scheduler + MySQL + Redis.
# 1) cp .env.production.example .env   and fill it in (see /docs/deployment)
# 2) docker compose up -d --build
# TLS: put Caddy, Traefik, a load balancer or Cloudflare in front of the "web" service (port 8080 by default).
x-app: &app
  image: avatarak/app:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - storage:/var/www/html/storage

services:
  app:
    <<: *app
    build:
      context: .
      target: app
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
    command: ["php-fpm"]

  web:
    build:
      context: .
      target: web
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
    image: avatarak/web:latest
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    <<: *app
    depends_on:
      app: { condition: service_healthy }
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60", "--max-time=3600"]
    stop_grace_period: 90s
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    depends_on:
      app: { condition: service_healthy }
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  mysql:
    image: ${DATABASE_IMAGE:-${IMAGE_REGISTRY:-docker.io/library}/mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-avatarak}
      MYSQL_USER: ${DB_USERNAME:-avatarak}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "if command -v mariadb-admin >/dev/null; then MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mariadb-admin ping -h 127.0.0.1 -uroot; else MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot; fi"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${IMAGE_REGISTRY:-docker.io/library}/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  storage:
  mysql:
  redis:
